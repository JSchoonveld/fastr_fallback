<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Returning to FastR…</title>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding-top: 3rem">
    <p id="msg">Returning to FastR…</p>
    <script>
      (function () {
        var ALLOWED = ['exp:', 'exps:', 'fastr:'];
        var params = new URLSearchParams(window.location.search);
        var msg = document.getElementById('msg');
        try {
          var state = params.get('state') || '';
          var encoded = state.split('.')[1] || '';
          var b64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
          while (b64.length % 4) b64 += '=';
          var target = decodeURIComponent(escape(atob(b64)));
          var scheme = target.slice(0, target.indexOf(':') + 1);
          if (ALLOWED.indexOf(scheme) === -1) throw new Error('Scheme not allowed');
          var out = new URL(target);
          ['code', 'state', 'error', 'error_description'].forEach(function (k) {
            if (params.has(k)) out.searchParams.set(k, params.get(k));
          });
          window.location.replace(out.toString());
        } catch (e) {
          msg.textContent = 'Could not return to the app. You can close this window.';
        }
      })();
    </script>
  </body>
</html>
